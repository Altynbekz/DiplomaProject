                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "404": {
            "description": "Problem response; see code and field errors",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "409": {
            "description": "Report already exists with different immutable operator provenance.",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "413": {
            "description": "Problem response; see code and field errors",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "415": {
            "description": "Problem response; see code and field errors",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "422": {
            "description": "Problem response; see code and field errors",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "500": {
            "description": "Problem response; see code and field errors",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "multipart/form-data": {
              "schema": {
                "type": "object",
                "additionalProperties": false,
                "properties": {
                  "report": {
                    "type": "string",
                    "format": "binary"
                  },
                  "provenance": {
                    "$ref": "#/components/schemas/ProvenanceInput"
                  }
                },
                "required": [
                  "report"
                ]
              },
              "encoding": {
                "provenance": {
                  "contentType": "application/json"
                }
              }
            }
          }
        },
        "description": "20 MiB total multipart limit, one report, optional provenance <=64 KiB; synchronous and atomic; duplicate returns 200."
      }
    },

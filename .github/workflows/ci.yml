name: M0/M1 checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 26.13.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.3'
      - name: Install pinned tooling and frontend dependencies
        run: |
          npm install --global npm@12.2.1
          npm ci --prefix frontend
          export GOBIN="$RUNNER_TEMP/diploma-bin"
          mkdir -p "$GOBIN"
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          go install github.com/pressly/goose/v3/cmd/goose@v3.30.1
          echo "$GOBIN" >> "$GITHUB_PATH"
      - name: Format, lint, check generated files and run unit tests
        env:
          GOFLAGS: -mod=readonly
        run: make check
      - name: Build frontend
        run: npm run build --prefix frontend
      - name: Build pinned PostgreSQL for disposable clusters
        run: |
          test "$(id -u)" -ne 0
          scripts/install-test-postgres.sh "$RUNNER_TEMP/diploma-postgres"
          echo "$RUNNER_TEMP/diploma-postgres/bin" >> "$GITHUB_PATH"
      - name: Run migrations and PostgreSQL integration tests
        env:
          GOFLAGS: -mod=readonly
        run: make test-integration
      - name: Install lockfile-pinned Playwright Chromium and system dependencies
        working-directory: frontend
        run: npm exec --no -- playwright install --with-deps chromium
      - name: Run browser tests against a second disposable cluster
        env:
          GOFLAGS: -mod=readonly
        run: make test-e2e
